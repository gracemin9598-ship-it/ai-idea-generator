<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 스타트업 20문 20답 코칭 센터 | Solo AI Builder</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12d379">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Solo AI">
    <link rel="apple-touch-icon" href="images/success_clover_bear.png">

    <!-- Google Fonts: Outfit & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & VARIABLE DEFINITIONS (Premium Mint & Pure White)
           ========================================================================== */
        :root {
            --bg-color: #f7faf8;         /* Soft Mint Pale Background */
            --primary-color: #12d379;    /* Bright Energetic Mint Green */
            --primary-light: #5df7a9;    /* Soft Light Mint */
            --primary-hover: #0fb868;    /* Active Darker Mint Green */
            --text-main: #181d19;        /* Deep Charcoal Greenish Black */
            --text-muted: #64748b;       /* Cool Slate Gray */
            --card-bg: #ffffff;          /* Pure White */
            --accent-bg: #f0fdf4;        /* Very Light Mint Tint */
            --border-color: #e2e8f0;     /* Subtle Slate Border */
            --shadow-subtle: 0 8px 30px rgba(18, 211, 121, 0.02);
            --shadow-medium: 0 16px 40px rgba(18, 211, 121, 0.06);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        /* Reset & Base Styles for Mobile Apps */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            min-height: 100dvh; /* dynamic viewport height to prevent mobile keyboard layout bug */
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain; /* Prevents iOS rubber-banding scroll pull down */
            padding-bottom: env(safe-area-inset-bottom); /* iOS notch safe area margin */
        }

        /* Container & Grid Layout */
        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            z-index: 10;
        }

        /* Modern Premium Header */
        header {
            text-align: center;
            margin-bottom: 12px;
            margin-top: 10px;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-hover);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ==========================================================================
           2. ANIMATIONS & TRANSITIONS
           ========================================================================== */
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-out {
            animation: fadeOut 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-8px); }
        }

        /* Common Premium Card Styles */
        .premium-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .premium-card:hover {
            box-shadow: var(--shadow-medium);
        }

        /* ==========================================================================
           3. CONVERSATIONAL CHAT COMPONENTS
           ========================================================================== */
        .chat-room {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 190px);
            min-height: 420px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background-color: var(--card-bg);
            overflow: hidden;
            margin-bottom: 0px;
            box-shadow: var(--shadow-medium);
        }

        .chat-header {
            background-color: var(--accent-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-status {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(18, 211, 121, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(18, 211, 121, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(18, 211, 121, 0); }
        }

        .chat-header-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .chat-history {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #fafdfb;
            scroll-behavior: smooth;
        }

        /* Bubble Styles */
        .chat-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            line-height: 1.5;
            animation: bubble-pop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            position: relative;
        }

        @keyframes bubble-pop {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-bubble.coach {
            background-color: var(--accent-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(18, 211, 121, 0.15);
            margin-top: 14px;
        }

        .chat-bubble.user {
            background-color: var(--primary-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(18, 211, 121, 0.15);
            margin-top: 14px;
            font-weight: 500;
        }

        .chat-bubble.coach::before {
            content: "AI 코치";
            position: absolute;
            top: -16px;
            left: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary-hover);
        }

        .chat-bubble.user::before {
            content: "나";
            position: absolute;
            top: -16px;
            right: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Typing Indicator animation */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background-color: var(--accent-bg);
            border-radius: var(--radius-md);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            margin-top: 8px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: typing-bounce 1s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Inline Controls Wrapper inside chat log */
        .inline-controls-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-medium);
            align-self: flex-start;
            width: 100%;
            max-width: 95%;
            margin-top: 8px;
            margin-left: 2px;
            animation: bubble-pop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        /* Passcode Keypad Styles (inspired by iOS lock screen passcode) */
        .passcode-dots-wrapper {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .passcode-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background-color: transparent;
            transition: var(--transition-smooth);
        }

        .passcode-dot.filled {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(18, 211, 121, 0.4);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 240px;
            margin: 0 auto 10px auto;
        }

        .keypad-btn {
            aspect-ratio: 1;
            height: 56px;
            width: 56px;
            margin: 0 auto;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            -webkit-tap-highlight-color: transparent;
        }

        .keypad-btn:active {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            transform: scale(0.92);
        }

        @media (hover: hover) {
            .keypad-btn:hover {
                background-color: var(--primary-color);
                color: #ffffff;
                border-color: var(--primary-color);
            }
        }

        .keypad-btn.action-key {
            font-size: 0.8rem;
            font-weight: 500;
            border-color: transparent;
            background-color: transparent;
            color: var(--text-muted);
        }

        .keypad-btn.action-key:active {
            background-color: var(--accent-bg);
            color: var(--text-main);
            transform: scale(0.95);
        }

        /* Choice Grid */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 2px;
        }

        .choice-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .choice-btn:hover {
            border-color: var(--primary-color);
            background-color: var(--accent-bg);
            transform: translateY(-1px);
        }

        .choice-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(18, 211, 121, 0.2);
        }

        .choice-btn .arrow {
            opacity: 0;
            transform: translateX(-4px);
            transition: var(--transition-smooth);
        }

        .choice-btn:hover .arrow, .choice-btn.active .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Smart Tag Suggestions */
        .tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tag-chip {
            background-color: var(--accent-bg);
            border: 1px solid rgba(18, 211, 121, 0.15);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-hover);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .tag-chip:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 14px;
            width: 100%;
        }

        .premium-input {
            width: 100%;
            min-height: 80px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 0.9rem;
            color: var(--text-main);
            font-family: inherit;
            resize: none;
            outline: none;
            transition: var(--transition-smooth);
        }

        .premium-input:focus {
            border-color: var(--primary-color);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(18, 211, 121, 0.08);
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            border-top: 1px dashed var(--border-color);
            padding-top: 14px;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 14px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(18, 211, 121, 0.2);
        }

        .nav-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .nav-btn.secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            flex: 0 0 auto;
            padding: 12px 16px;
        }

        /* Progress Bar */
        .survey-progress-wrapper {
            margin-bottom: 12px;
        }
        
        .survey-steps-indicator {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .survey-progress-track {
            height: 4px;
            background-color: var(--accent-bg);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .survey-progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 5%;
            border-radius: 2px;
            transition: var(--transition-smooth);
        }

        /* ==========================================================================
           4. LOADING TRANSITION SCREEN (Left screenshot inspired)
           ========================================================================== */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100dvh - 160px);
            padding: 24px 16px;
            text-align: center;
            position: relative;
        }

        .loading-gauge-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin-bottom: 30px;
        }

        .loading-gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .loading-gauge-bg {
            fill: none;
            stroke: #eefaf2;
            stroke-width: 7;
        }

        .loading-gauge-fill {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.08s linear;
        }

        .loading-gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.03em;
        }

        .loading-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .loading-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 400;
        }

        .loading-checklist {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checklist-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-subtle);
            text-align: left;
            transition: var(--transition-smooth);
            opacity: 0.5;
        }

        .checklist-card.active {
            opacity: 1;
            border-color: var(--primary-color);
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }

        .chk-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: var(--border-color);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition-smooth);
        }

        .checklist-card.active .chk-icon {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .chk-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .checklist-card.active .chk-text {
            color: var(--text-main);
            font-weight: 700;
        }

        .loading-deco-left {
            position: absolute;
            bottom: 20px;
            left: -10px;
            animation: bounce 3s infinite ease-in-out;
            opacity: 0.7;
        }

        .loading-deco-right {
            position: absolute;
            bottom: 12px;
            right: -10px;
            animation: bounce 3s infinite ease-in-out;
            animation-delay: 1.5s;
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ==========================================================================
           5. DASHBOARD VIEW COMPONENTS
           ========================================================================== */
        .dashboard-welcome {
            margin-bottom: 24px;
            text-align: center;
        }

        .dashboard-welcome h2 {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .dashboard-welcome p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .cards-headline {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-hover);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .business-canvas-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        @media (max-width: 576px) {
            .business-canvas-grid {
                grid-template-columns: 1fr;
            }
        }

        .canvas-block {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px;
            position: relative;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-subtle);
        }

        .canvas-block:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-medium);
        }

        .canvas-tag {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary-hover);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            display: inline-block;
            background-color: rgba(18, 211, 121, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .canvas-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .canvas-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        /* Circular Feasibility Score Gauge */
        .feasibility-score-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-subtle);
        }

        .circular-gauge {
            position: relative;
            width: 76px;
            height: 76px;
            flex-shrink: 0;
        }

        .gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .gauge-bg {
            fill: none;
            stroke: #eefaf2;
            stroke-width: 8;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-dasharray: 226.2;
            stroke-dashoffset: 226.2;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s ease-out;
        }

        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
        }

        /* Roadmap Timeline */
        .roadmap-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .roadmap-step {
            display: flex;
            gap: 12px;
            position: relative;
        }

        .roadmap-step::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 36px;
            bottom: -16px;
            width: 1px;
            background-color: var(--border-color);
        }

        .roadmap-step:last-child::before {
            display: none;
        }

        .roadmap-badge {

                localStorage.setItem(STORAGE_KEY, JSON.stringify(rawState));

        // Timer for loading screen animation
        function startLoadingAnimation() {
            let percent = 0;
            const progressFill = document.getElementById('loadingGaugeFill');
            const percentText = document.getElementById('loadingPercent');
            
            const radius = 42;
            const circumference = 2 * Math.PI * radius; // ~263.89
            
            if (progressFill) {
                progressFill.style.strokeDasharray = circumference;
                progressFill.style.strokeDashoffset = circumference;
            }
            
            const interval = setInterval(() => {
                let increment = 2;
                if (percent >= 80 && percent <= 90) increment = 1; // linger at 88%
                
                percent += increment;
                if (percent > 100) percent = 100;
                
                if (percentText) percentText.innerText = `${percent}%`;
                
                if (progressFill) {
                    const offset = circumference - (percent / 100) * circumference;
                    progressFill.style.strokeDashoffset = offset;
                }
                
                if (percent >= 25) {
                    const step1 = document.getElementById('chkStep1');
                    if (step1) step1.classList.add('active');
                }
                if (percent >= 60) {
                    const step2 = document.getElementById('chkStep2');
                    if (step2) step2.classList.add('active');
                }
                if (percent >= 88) {
                    const step3 = document.getElementById('chkStep3');
                    if (step3) step3.classList.add('active');
                }
                
                if (percent === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        navigateTo('dashboard');
                    }, 650);
                }
            }, 80);
        }

        function bindSurveyEvents() {
            // 1. Password Verification step (Keypad logic)
            if (!state.isAuthenticated) {
                const keys = document.querySelectorAll('.keypad-btn');
                keys.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const key = btn.getAttribute('data-key');
                        let current = state.enteredPasscode || '';
                        
                        if (key === 'clear') {
                            state.enteredPasscode = '';
                        } else if (key === 'back') {
                            if (current.length > 0) {
                                state.enteredPasscode = current.slice(0, -1);
                            }
                        } else {
                            if (current.length < 4) {
                                const nextPasscode = current + key;
                                state.enteredPasscode = nextPasscode;
                                
                                // Auto check when 4 digits are entered
                                if (nextPasscode.length === 4) {
                                    setTimeout(() => {
                                        if (nextPasscode === SECURE_PASSWORD) {
                                            state.passwordFailCount = 0;
                                            state.enteredPasscode = '';
                                            state.isAuthenticated = true;
                                        } else {
                                            state.passwordFailCount = state.passwordFailCount + 1;
                                            state.enteredPasscode = '';
                                        }
                                    }, 250);
                                }
                            }
                        }
                    });
                });
                return;
            }

            // 2. Step 1~20 Verification
            const step = state.surveyStep;
            const q = QUESTIONS[step - 1];

            if (q.type === 'select') {
                const buttons = document.querySelectorAll('.choice-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.getAttribute('data-value');
                        btn.classList.add('active');
                        
                        const typingIndicator = document.getElementById('typingIndicator');
                        if (typingIndicator) typingIndicator.style.display = 'inline-flex';
                        
                        setTimeout(() => {
                            const updatedAnswers = { ...state.answers };
                            updatedAnswers[q.key] = val;
                            state.answers = updatedAnswers;

                            if (step < 20) {
                                state.surveyStep = step + 1;
                            } else {
                                navigateTo('loading');
                            }
                        }, 550);
                    });
                });
            }

            if (q.type === 'input') {
                const customInput = document.getElementById('customInput');
                const nextBtn = document.getElementById('btnNextStep');
                
                if (customInput) {
                    customInput.focus();
                    const len = customInput.value.length;
                    customInput.setSelectionRange(len, len);

                    customInput.addEventListener('input', (e) => {
                        const text = e.target.value;
                        if (text.trim().length > 0) {
                            if (nextBtn) nextBtn.removeAttribute('disabled');
                        } else {
                            if (nextBtn) nextBtn.setAttribute('disabled', 'true');
                        }
                    });
                }

                const tags = document.querySelectorAll('.tag-chip');
                tags.forEach(tag => {
                    tag.addEventListener('click', () => {
                        const val = tag.getAttribute('data-tag');
                        if (customInput) {
                            let separator = customInput.value.trim().length > 0 ? ', ' : '';
                            customInput.value = customInput.value + separator + val;
                            if (customInput.value.trim().length > 0) {
                                if (nextBtn) nextBtn.removeAttribute('disabled');
                            }
                            customInput.focus();
                        }
                    });
                });

                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        const finalVal = customInput ? customInput.value.trim() : '';
                        if (!finalVal) return;
                        
                        const typingIndicator = document.getElementById('typingIndicator');
                        if (typingIndicator) typingIndicator.style.display = 'inline-flex';

                        setTimeout(() => {
                            const updatedAnswers = { ...state.answers };
                            updatedAnswers[q.key] = finalVal;
                            state.answers = updatedAnswers;

                            if (step < 20) {
                                state.surveyStep = step + 1;
                            } else {
                                navigateTo('loading');
                            }
                        }, 400);
                    });
                }
            }

            const prevBtn = document.getElementById('btnPrevStep');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (step > 1) {
                        state.surveyStep = step - 1;
                    }
                });
            }
        }

        // Generate weekly habits array
        function getWeeklyTrackerData() {
            const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
            const today = new Date();
            const result = [];
            
            for (let i = 6; i >= 0; i--) {
                const targetDate = new Date();
                targetDate.setDate(today.getDate() - i);
                const dateStr = targetDate.toISOString().split('T')[0];
                const dayNum = targetDate.getDay();
                
                const isCompleted = state.trackingHistory.some(log => log.date === dateStr && log.completed);
                const isToday = i === 0;

                result.push({
                    dateStr,
                    dayLabel: daysOfWeek[dayNum],
                    completed: isCompleted,
                    isToday
                });
            }
            return result;
        }

                    <div class="canvas-block">

                </div>

                <!-- 🚀 3-Step Implementation Roadmap Section -->
                <div class="cards-headline" style="margin-bottom: 12px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>

                </div>

                <div class="roadmap-timeline">
                    <!-- Day 1 -->
                    <div class="roadmap-step">
                        <div class="roadmap-badge">1일</div>
                        <div class="roadmap-content">
                            <h4>[1단계] 첫 간이 웹사이트 만들기</h4>
                            <p>${plan.day1Action}</p>
                        </div>
                    </div>

                    <!-- Day 3 -->
                    <div class="roadmap-step">
                        <div class="roadmap-badge" style="background-color: var(--primary-light);">3일</div>
                        <div class="roadmap-content">
                            <h4>[2단계] 이웃 소문 내고 첫 단골 모집하기</h4>
                            <p>${plan.day3Action}</p>
                        </div>
                    </div>

                    <!-- Day 7 -->
                    <div class="roadmap-step">
                        <div class="roadmap-badge">7일</div>
                        <div class="roadmap-content">
                            <h4>[3단계] 결제 연결망 연동 및 문 열기</h4>
                            <p>${plan.day7Action}</p>
                        </div>
                    </div>
                </div>

                <!-- 🛡️ Personalized Obstacle Solver -->
                <div class="cards-headline">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    1:1 따뜻한 코치의 두려움 돌파 처방전
                </div>
                <div class="obstacle-alert">
                    <h4>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        "${barrierSafe.substring(0, 15)}"에 대한 맞춤형 조언
                    </h4>
                    <p>${plan.obstacleSolverText}</p>
                </div>

                <!-- 🗓️ Habit Tracker -->
                <div class="cards-headline">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    내 꿈을 가꾸는 든든한 하루 한 걸음 밭
                </div>

                <div class="dashboard-tracker-card">
                    <div class="tracker-stats-grid">
                        <div class="tracker-stat-box">
                            <div class="stat-num">${state.streak}일</div>
                            <div class="stat-lbl">연속 실천 일수</div>
                        </div>
                        <div class="tracker-stat-box">
                            <div class="stat-num">${state.completedCount}회</div>
                            <div class="stat-lbl">누적 완료 횟수</div>
                        </div>
                    </div>

                    <div class="weekly-dots-container">
                        ${weeklyData.map(day => `
                            <div class="calendar-dot-box">
                                <div class="calendar-dot ${day.completed ? 'completed' : ''} ${day.isToday ? 'today' : ''}">
                                    ${day.completed ? `✓` : day.isToday ? '오늘' : ''}
                                </div>
                                <span class="calendar-day-label">${day.dayLabel}</span>
                            </div>
                        `).join('')}
                    </div>

                    <button class="complete-action-btn" id="btnCompleteToday" ${isTodayCompleted ? 'disabled' : ''}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        ${isTodayCompleted ? '오늘 하루, 소중한 한 걸음 완료!' : '오늘 하루, 한 걸음 걷기 완료'}
                    </button>
                </div>

                <!-- 🔔 Smart Push Notification Card -->
                <div class="tracker-notification-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <span class="notification-badge">스마트 실천 알람</span>
                    </div>
                    <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin-top: 10px; margin-bottom: 6px; letter-spacing: -0.02em; line-height: 1.4;">
                        루틴 알림을 켜고 매일 까먹지 않고 행동해 보세요!
                    </h4>
                    <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
                        당신의 소중한 약속을 지켜드릴게요. 매일 정한 가용 시간인 [${timeSafe.split(' (')[0]}]에 맞춰 알림을 보내 드립니다.
                    </p>
                    
                    <div class="notification-previews">
                        <div class="notification-preview-item">
                            <div class="preview-header">
                                <span class="preview-brand">✉️ Solo AI 코치</span>
                                <span class="preview-time">7분 전</span>
                            </div>
                            <div class="preview-body">
                                [${timeSafe.split(' (')[0]} 창업 실천 ⏱️] 루틴을 실천할 시간이에요!
                            </div>
                        </div>
                        <div class="notification-preview-item">
                            <div class="preview-header">
                                <span class="preview-brand">✉️ Solo AI 코치</span>
                                <span class="preview-time">15분 전</span>
                            </div>
                            <div class="preview-body">
                                [🎯 ${plan.brandName}] 오늘 1단계 실천 약속을 정말 멋지게 지키셨습니다! 오늘도 수고하셨어요 :)
                            </div>
                        </div>
                    </div>
                    
                    <button class="complete-action-btn" id="btnEnableNotifications">
                        알람 켜기
                    </button>
                    <button class="nav-btn secondary" id="btnDisableNotifications" style="width: 100%; border: none; background: transparent; color: var(--text-muted); font-size: 0.8rem; padding: 6px; margin-top: 6px; box-shadow: none;">
                        지금은 괜찮아요
                    </button>
                </div>

                <!-- 📤 Share & Reset Action Toolbar -->
                <div class="action-toolbar">
                    <button class="complete-action-btn" id="btnSharePlan" style="background-color: var(--primary-hover); color: #ffffff; border-radius: var(--radius-md); box-shadow: 0 4px 14px rgba(18, 211, 121, 0.25);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                        기획서 친구에게 공유하기 🍀
                    </button>
                    <button class="toolbar-btn re-diagnose" id="btnReDiagnose">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
                        다른 아이디어로 다시 기획하기
                    </button>
                    <button class="toolbar-btn hard-reset" id="btnHardReset">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        모든 데이터 지우기 (초기화)
                    </button>
                </div>
            `;
        }

        function bindDashboardEvents() {
            const plan = generateBusinessPlan();

            // 1. Log habit check-in
            const btnComplete = document.getElementById('btnCompleteToday');
            if (btnComplete) {
                btnComplete.addEventListener('click', () => {
                    const todayStr = new Date().toISOString().split('T')[0];
                    const alreadyCompleted = state.trackingHistory.some(log => log.date === todayStr && log.completed);
                    if (alreadyCompleted) return;

                    const updatedHistory = [...state.trackingHistory, { date: todayStr, completed: true }];
                    
                    state.streak = state.streak + 1;
                    state.completedCount = state.completedCount + 1;
                    state.trackingHistory = updatedHistory;
                });
            }

            // 2. Re-diagnose
            const btnReDiagnose = document.getElementById('btnReDiagnose');
            if (btnReDiagnose) {
                btnReDiagnose.addEventListener('click', () => {
                    if (confirm("습관 실천 기록(연속 일수)은 유지한 채, 새로운 아이디어로 20문 20답을 다시 시작하시겠습니까?")) {
                        state.surveyStep = 1;
                        state.answers = { ...INITIAL_STATE.answers };
                        navigateTo('survey');
                    }
                });
            }

            // 3. Hard Reset
            const btnHardReset = document.getElementById('btnHardReset');
            if (btnHardReset) {
                btnHardReset.addEventListener('click', () => {
                    if (confirm("⚠️ 경고: 연속 실천 기록을 포함한 모든 데이터가 완전히 삭제됩니다. 진행하시겠습니까?")) {
                        localStorage.removeItem(STORAGE_KEY);
                        window.location.reload();
                    }
                });
            }

            // 4. Smart Sharing Button (Web Share API with Clipboard Copy Fallback)
            const btnShare = document.getElementById('btnSharePlan');
            if (btnShare) {
                btnShare.addEventListener('click', () => {
                    const shareText = `🍀 [Solo AI 코칭 센터] 🍀\n\n내 창업 브랜드: 🎉 ${plan.brandName} 🎉\n"${plan.slogan}"\n\n비즈니스 실현 가능성 점수: ${plan.feasibilityScore}%\n\n나만의 5Whys 창업 기획서를 무료로 분석받고 실천 루틴을 짜보세요! 👇\n${window.location.origin}${window.location.pathname}?v=${Date.now()}`;
                    
                    if (navigator.share) {
                        navigator.share({
                            title: `${plan.brandName} - Solo AI 창업 기획서`,
                            text: shareText,
                            url: window.location.origin + window.location.pathname
                        }).catch(err => console.log('Share error:', err));
                    } else {
                        navigator.clipboard.writeText(shareText).then(() => {
                            alert("📋 기획서 요약 내용과 주소가 클립보드에 복사되었습니다!\n\n카카오톡 대화방이나 블로그에 붙여넣기(Ctrl+V)하여 친구들에게 나만의 행운을 공유해 보세요! 🍀");
                        }).catch(err => {
                            alert("클립보드 복사에 실패했습니다. 기획서 내용을 직접 복사해 주세요.");
                        });
                    }
                });
            }

            // 5. Push Alarms trigger
            const btnEnableNotifications = document.getElementById('btnEnableNotifications');
            if (btnEnableNotifications) {
                btnEnableNotifications.addEventListener('click', () => {
                    const timeSafe = state.answers.time || '30분';
                    if (!("Notification" in window)) {
                        alert("🔔 알람 등록 완료! 매일 약속한 시간인 [" + timeSafe.split(' (')[0] + "]에 기기 푸시 알림으로 코치 피드백을 전달해 드립니다.");
                        return;
                    }

                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            alert("🔔 실천 알람 설정이 성공적으로 켜졌습니다! 매일 정해진 시간인 [" + timeSafe.split(' (')[0] + "]에 기기 알림으로 코치 피드백을 전달해 드립니다.");
                            
                            new Notification("Solo AI 코칭 센터", {
                                body: `🔓 알람 등록 완료! [${plan.brandName}] 여정을 시작할 준비가 되셨습니다.`,
                                icon: "data:image/svg+xml;utf8,<svg width='64' height='64' xmlns='http://www.w3.org/2000/svg'><circle cx='32' cy='32' r='30' fill='%2312d379'/><path d='M20 32l8 8 16-16' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>"
                            });
                        } else {
                            alert("🔔 브라우저 알람 등록이 완료되었습니다. 매일 코칭 시간에 피드백 메일과 함께 스마트폰/데스크톱 알림이 전송됩니다!");
                        }
                    });
                });
            }

            const btnDisableNotifications = document.getElementById('btnDisableNotifications');
            if (btnDisableNotifications) {
                btnDisableNotifications.addEventListener('click', () => {
                    alert("알림 설정이 보류되었습니다. 매일 대시보드 데일리 트래커를 직접 방문하여 활동을 기록해 보세요.");
                });
            }
        }

        // --- 10. DEVELOPER / DEBUG TOOLS EVENTS ---
        
        // Mock 7-day data injection
        document.getElementById('btnInjectDemo').addEventListener('click', () => {
            const history = [];
            const today = new Date();
            
            for (let i = 6; i >= 0; i--) {
                const pastDate = new Date();
                pastDate.setDate(today.getDate() - i);
                const dateStr = pastDate.toISOString().split('T')[0];
                history.push({
                    date: dateStr,
                    completed: true
                });
            }

            state.isAuthenticated = true; // Auto auth bypass for debugging
            state.streak = 7;
            state.completedCount = 7;
            state.trackingHistory = history;
            
            state.answers = {
                domain: "AI 비즈니스 자동화 (단순 수작업 자동 RPA 등)",
                why1: "💰 직장 월급 외에 매달 든든한 추가 수입을 원해요",
                why2: "나만의 자유시간 확보 및 경제적 불안 완전 해방",
                why3: "하루 종일 일하지 않아도 알아서 돈을 버는 자동화 파이프라인 형성",
                scale: "인건비 없이 AI 비서들과 완전 자동화하는 초경량 1인 기업",
                audience: "바쁘고 마케팅 인력이 부족한 소상공인/1인 자영업자 사장님",
                pain: "단순하고 무의식적인 수작업이 너무 많아 몸이 묶여 있음",
                custWhy1: "인건비 부담으로 유료 직원이나 전문가를 고용할 자금이 없어서",
                custWhy2: "하루 종일 쉴 틈 없이 돌아가는 과중한 생업 환경 탓에",
                custJoy: "하루 평균 1~2시간의 완전한 휴식 및 본질 연구 시간 획득",
                solution: "구글 시트에 정보만 채워넣으면 자동으로 릴스 숏폼 에셋이 쏟아지는 자동화 템플릿",
                asset: "꼼꼼한 엑셀 데이터 분석 및 기획력",
                barrier: "코딩이나 프로그램 개발 지식이 전무해요",
                barrierWhy: "실패했을 때 시간이나 소액의 돈이 낭비될지 모른다는 막연한 무서움 때문에",
                time: "⏱️ 하루 30분 (효율적인 저녁 집중 루틴 가동)",
                revenue: "매월 고정 수입이 누적되어 안정을 주는 '정기 구독제 멤버십'",
                trust: "핵심 가치의 30%를 맛보기로 체험하는 '무료 선체험판' 배포",
                budget: "월 5만 원 미만 (업무 효율을 200% 늘릴 유료 챗GPT나 일부 API 결제)",
                income: "월 200만 원 (든든한 제2의 월급이자 본업 의존도 하향)",
                commitment: "🔥 네! 나만의 비즈니스를 위해 7일간 무조건 실행하겠습니다!"
            };

            if (state.currentView !== 'dashboard') {
                navigateTo('dashboard');
            } else {
                render();
            }
        });

        // Debug reset demo button
        document.getElementById('btnResetDemo').addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            window.location.reload();
        });

        // Register PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('ServiceWorker registered successfully!', reg))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }

        // Handle PWA installation prompt for Android
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installCard = document.getElementById('pwaAndroidInstallCard');
            if (installCard) installCard.style.display = 'flex';
        });

        // Delegation click listener for Android install button
        document.body.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'btnInstallPwaAndroid') {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('PWA installation accepted by user');
                        }
                        deferredPrompt = null;
                        const installCard = document.getElementById('pwaAndroidInstallCard');
                        if (installCard) installCard.style.display = 'none';
                    });
                }
            }
        });

        // --- 11. APPLICATION INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromLocalStorage();
            
            const ans = state.answers;
            const isCompleted = ans.domain && ans.why1 && ans.why2 && ans.why3 && ans.scale && 
                                ans.audience && ans.pain && ans.custWhy1 && ans.custWhy2 && 
                                ans.custJoy && ans.solution && ans.asset && ans.barrier && 
                                ans.barrierWhy && ans.time && ans.revenue && ans.trust && 
                                ans.budget && ans.income && ans.commitment;

            if (isCompleted) {
                state.currentView = 'dashboard';
            } else {
                state.surveyStep = 1;
                state.currentView = 'survey';
            }
            
            render();
        });
    </script>
</body>
</html>
