<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 1인 창업 아이디어 생성기 | Solo AI Business Hub</title>
    <!-- Google Fonts: Outfit & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & VARIABLE DEFINITIONS (Premium Ivory & Deep Teal)
           ========================================================================== */
        :root {
            --bg-color: #f9f8f6;         /* Premium Ivory */
            --primary-color: #2d5a53;    /* Deep Teal */
            --primary-light: #457e75;    /* Soft Teal */
            --primary-hover: #1b3a35;    /* Dark Teal */
            --text-main: #1c1c1c;        /* Deep Charcoal */
            --text-muted: #6b6a67;       /* Warm Gray Muted */
            --card-bg: #ffffff;          /* Pure White */
            --accent-bg: #f1efe9;        /* Warm Light Ivory */
            --border-color: #e6e3da;     /* Subtle Warm Gray Border */
            --shadow-subtle: 0 8px 32px rgba(45, 90, 83, 0.04);
            --shadow-medium: 0 16px 48px rgba(45, 90, 83, 0.08);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Container & Grid Layout */
        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Modern Premium Header */
        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* ==========================================================================
           2. ANIMATIONS & TRANSITIONS
           ========================================================================== */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-out {
            animation: fadeOut 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-8px);
            }
        }

        /* Common Premium Card Styles */
        .premium-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .premium-card:hover {
            box-shadow: var(--shadow-medium);
        }

        /* ==========================================================================
           3. SURVEY VIEW COMPONENTS
           ========================================================================== */
        .survey-progress-wrapper {
            margin-bottom: 36px;
        }
        
        .survey-steps-indicator {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .survey-progress-track {
            height: 3px;
            background-color: var(--accent-bg);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .survey-progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 25%;
            border-radius: 2px;
            transition: var(--transition-smooth);
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.45;
            margin-bottom: 28px;
            text-align: center;
        }

        .question-title span {
            display: block;
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .illustration-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 12px 0 24px;
        }

        .sprout-svg {
            animation: waveSprout 3s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes waveSprout {
            0% { transform: rotate(-2deg) scale(1); }
            100% { transform: rotate(4deg) scale(1.02); }
        }

        .emotional-quote {
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: 500;
            margin-top: 12px;
            letter-spacing: -0.01em;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .chip-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .chip-btn-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .chip-btn-desc {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .chip-btn:hover .chip-btn-desc {
            color: var(--primary-light);
        }

        .chip-btn.active .chip-btn-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        .chip-btn:hover {
            border-color: var(--primary-color);
            background-color: var(--bg-color);
            transform: translateY(-1px);
        }

        .chip-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 6px 20px rgba(45, 90, 83, 0.15);
        }

        .chip-btn .arrow-icon {
            opacity: 0;
            transform: translateX(-4px);
            transition: var(--transition-smooth);
            stroke: currentColor;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .chip-btn:hover .arrow-icon, .chip-btn.active .arrow-icon {
            opacity: 1;
            transform: translateX(0);
        }

        .chip-row-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-group {
            margin-bottom: 24px;
            width: 100%;
        }

        .premium-input {
            width: 100%;
            min-height: 100px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            font-family: inherit;
            resize: none;
            outline: none;
            transition: var(--transition-smooth);
        }

        .premium-input:focus {
            border-color: var(--primary-color);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(45, 90, 83, 0.08);
        }

        .btn-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 28px;
            gap: 12px;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px 28px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 16px rgba(45, 90, 83, 0.15);
        }

        .nav-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .nav-btn.secondary-link {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            flex: 0 0 auto;
            padding: 16px 20px;
        }

        .nav-btn.secondary-link:hover {
            color: var(--text-main);
            background-color: rgba(0, 0, 0, 0.03);
            box-shadow: none;
        }

        /* ==========================================================================
           4. DASHBOARD VIEW COMPONENTS
           ========================================================================== */
        .dashboard-welcome {
            margin-bottom: 28px;
            text-align: center;
        }

        .dashboard-welcome h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .dashboard-welcome p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .cards-headline {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
        }

        .idea-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
            position: relative;
        }

        .idea-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
            border-color: var(--primary-light);
        }

        .idea-card-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-color);
            background-color: rgba(45, 90, 83, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 0.02em;
        }

        .idea-card.freelance .idea-card-badge {
            color: #8c6a2d;
            background-color: rgba(140, 106, 45, 0.08);
        }

        .idea-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .idea-card p.description {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 18px;
        }

        .idea-card-steps {
            background-color: var(--bg-color);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            border: 1px dashed var(--border-color);
        }

        .idea-card-steps h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .step-item {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.45;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-item span.bullet {
            color: var(--primary-color);
            font-weight: bold;
        }

        .stats-headline {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-tracker-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 32px;
        }

        .tracker-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .tracker-stat-box {
            text-align: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px 12px;
            transition: var(--transition-smooth);
        }

        .tracker-stat-box:hover {
            border-color: var(--primary-color);
            background-color: var(--card-bg);
        }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
            font-family: 'Outfit', sans-serif;
            margin-bottom: 4px;
            line-height: 1;
        }

        .stat-lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .weekly-calendar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            text-align: center;
        }

        .weekly-dots-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .calendar-dot-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .calendar-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            transition: var(--transition-smooth);
            color: var(--text-muted);
        }

        .calendar-dot.completed {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 4px 12px rgba(45, 90, 83, 0.2);
        }

        .calendar-dot.today {
            border-color: var(--primary-color);
            border-width: 2px;
        }

        .calendar-dot svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.5;
        }

        .calendar-day-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .complete-action-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(45, 90, 83, 0.1);
        }

        .complete-action-btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(45, 90, 83, 0.2);
        }

        .complete-action-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ==========================================================================
           5. FLOATING DEMO PANEL (TEST TOOL)
           ========================================================================== */
        .floating-demo-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-medium);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 200px;
            transition: var(--transition-smooth);
        }

        .floating-demo-panel h4 {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-btn {
            background-color: var(--accent-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
        }

        .demo-btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border-color: var(--primary-color);
        }

        .demo-btn.secondary {
            background-color: transparent;
            color: var(--text-muted);
            border-color: transparent;
        }

        .demo-btn.secondary:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--text-main);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Modern Premium Header -->
        <header>
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-color);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Solo AI Builder
            </div>
            <div class="subtitle">1인 창업 및 프리랜서 맞춤형 AI 아이디어 생성기</div>
        </header>

        <!-- Main Dynamic View Container -->
        <main id="app" class="fade-in">
            <!-- Dynamic view content will be injected here by the Reactive JS engine -->
        </main>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 Solo AI Business Hub. Made with minimalist aesthetics.
    </footer>

    <!-- Floating Demo / Debug Tool Panel -->
    <div class="floating-demo-panel" id="demoPanel">
        <h4>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            개발 테스트 도구
        </h4>
        <button class="demo-btn" id="btnInjectDemo">7일 데모 데이터 주입</button>
        <button class="demo-btn secondary" id="btnResetDemo">데이터 초기화</button>
    </div>

    <!-- ==========================================================================
       6. REACTIVE STATE ENGINE & CORE LOGIC
       ========================================================================== -->
    <script>
        // --- (1) GLOBAL STATE DEFINITION ---
        const INITIAL_STATE = {
            currentView: 'survey', // 'survey' | 'dashboard'
            surveyStep: 1,         // 1 | 2 | 3 | 4 (Expanded from 3)
            answers: {
                interest: '',      // AI 콘텐츠 제작...
                time: '',          // 15분...
                platform: '',      // 오프라인 피지컬 자동화, 온라인 디지털 자동화, 온오프라인 하이브리드
                skill: ''          // 주관식 무기 (기술/특기)
            },
            streak: 0,
            completedCount: 0,
            trackingHistory: []   // { date: 'YYYY-MM-DD', completed: true }
        };

        // Reactive State Proxy
        let state = new Proxy({ ...INITIAL_STATE }, {
            set(target, property, value) {
                target[property] = value;
                saveStateToLocalStorage();
                render();
                return true;
            }
        });

        // --- (2) LOCALSTORAGE UTILITIES ---
        const STORAGE_KEY = 'SOLO_AI_BUILDER_STATE';

        function saveStateToLocalStorage() {
            try {
                const rawState = {
                    currentView: state.currentView,
                    surveyStep: state.surveyStep,
                    answers: { ...state.answers },
                    streak: state.streak,
                    completedCount: state.completedCount,
                    trackingHistory: [...state.trackingHistory]
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(rawState));
            } catch (e) {
                console.error("Failed to save state to localStorage", e);
            }
        }

        function loadStateFromLocalStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.currentView = parsed.currentView || 'survey';
                    state.surveyStep = parsed.surveyStep || 1;
                    state.answers = parsed.answers || { interest: '', time: '', platform: '', skill: '' };
                    state.streak = parsed.streak || 0;
                    state.completedCount = parsed.completedCount || 0;
                    state.trackingHistory = parsed.trackingHistory || [];
                }
            } catch (e) {
                console.error("Failed to load state from localStorage, using initial state", e);
            }
        }

        // --- (3) ROUTING & VIEW TRANSITION ---
        function navigateTo(viewName) {
            const appEl = document.getElementById('app');
            appEl.classList.remove('fade-in');
            appEl.classList.add('fade-out');

            setTimeout(() => {
                state.currentView = viewName;
                appEl.classList.remove('fade-out');
                appEl.classList.add('fade-in');
            }, 300);
        }

        // --- (4) CORE RENDER CONTROLLER ---
        function render() {
            const appEl = document.getElementById('app');
            if (!appEl) return;

            if (state.currentView === 'survey') {
                appEl.innerHTML = renderSurveyView();
                bindSurveyEvents();
            } else if (state.currentView === 'dashboard') {
                appEl.innerHTML = renderDashboardView();
                bindDashboardEvents();
            }
        }

        // ==========================================================================
        // 5. SURVEY COMPONENT VIEW & EVENTS (Updated for Platform Step & Step 4)
        // ==========================================================================
        const INTEREST_OPTIONS = [
            "AI 콘텐츠 제작 (블로그, 숏폼 등)",
            "AI 비즈니스 자동화 (RPA, 업무 자동화 등)",

        function bindSurveyEvents() {
            const step = state.surveyStep;

            if (step === 1) {
                const buttons = document.querySelectorAll('.chip-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.getAttribute('data-value');
                        btn.classList.add('active');
                        
                        setTimeout(() => {
                            state.answers = { ...state.answers, interest: val };
                            state.surveyStep = 2;
                        }, 250);
                    });
                });
            }

            if (step === 2) {
                const buttons = document.querySelectorAll('.chip-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.getAttribute('data-value');
                        btn.classList.add('active');
                        
                        setTimeout(() => {
                            state.answers = { ...state.answers, time: val };
                            state.surveyStep = 3; // Navigate to new platform question
                        }, 250);
                    });
                });

                document.getElementById('btnPrevStep').addEventListener('click', () => {
                    state.surveyStep = 1;
                });
            }

            if (step === 3) {
                // Bind new Platform selection events
                const buttons = document.querySelectorAll('.chip-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.getAttribute('data-value');
                        btn.classList.add('active');
                        
                        setTimeout(() => {
                            state.answers = { ...state.answers, platform: val };
                            state.surveyStep = 4; // Navigate to subjective skill input
                        }, 250);
                    });
                });

                document.getElementById('btnPrevStep').addEventListener('click', () => {
                    state.surveyStep = 2;
                });
            }

            if (step === 4) {
                const skillInput = document.getElementById('skillInput');
                const submitBtn = document.getElementById('btnSubmitSurvey');

                skillInput.addEventListener('input', (e) => {
                    const text = e.target.value;
                    state.answers.skill = text;
                    if (text.trim().length > 0) {
                        submitBtn.removeAttribute('disabled');
                    } else {
                        submitBtn.setAttribute('disabled', 'true');
                    }
                });

                document.getElementById('btnPrevStep').addEventListener('click', () => {
                    state.surveyStep = 3;
                });

                submitBtn.addEventListener('click', () => {
                    if (!state.answers.skill.trim()) return;
                    navigateTo('dashboard');
                });
            }
        }

        // Generate weekly array based on tracking history
        function getWeeklyTrackerData() {
            const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
            const today = new Date();
            const result = [];
            
            for (let i = 6; i >= 0; i--) {
                const targetDate = new Date();
                targetDate.setDate(today.getDate() - i);
                const dateStr = targetDate.toISOString().split('T')[0];
                const dayNum = targetDate.getDay();
                
                const isCompleted = state.trackingHistory.some(log => log.date === dateStr && log.completed);
                const isToday = i === 0;

                result.push({
                    dateStr,
                    dayLabel: daysOfWeek[dayNum],
                    completed: isCompleted,
                    isToday
                });
            }
            return result;
        }

            return `
                <div class="dashboard-welcome">
                    <h2>🎯 당신만의 AI 비즈니스 로드맵</h2>
                    <p style="margin-top: 4px;">
                        ${state.answers.interest.split(' (')[0]} 
                        × <strong>${state.answers.platform.split(' (')[0]}</strong> 
                        × 하루 ${state.answers.time} 
                        × 강력한 무기 [${state.answers.skill}]
                    </p>
                </div>

                <div class="cards-headline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    나를 위한 맞춤형 창업 모델 추천
                </div>

                <div class="cards-grid">
                    <!-- Card 1: Startup Model -->
                    <div class="idea-card">
                        <div class="idea-card-badge">AI 1인 창업 비즈니스</div>
                        <h3>${ideas.startup.title}</h3>
                        <p class="description">${ideas.startup.desc}</p>
                        <div class="idea-card-steps">
                            <h4>실천 액션 플랜</h4>
                            ${ideas.startup.steps.map((step, idx) => `
                                <div class="step-item">
                                    <span class="bullet">0${idx+1}.</span>
                                    <div>${step}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Card 2: Freelancing Model -->
                    <div class="idea-card freelance">
                        <div class="idea-card-badge">AI 초고속 프리랜서 / 대행</div>
                        <h3>${ideas.freelance.title}</h3>
                        <p class="description">${ideas.freelance.desc}</p>
                        <div class="idea-card-steps">
                            <h4>실천 액션 플랜</h4>
                            ${ideas.freelance.steps.map((step, idx) => `
                                <div class="step-item">
                                    <span class="bullet">0${idx+1}.</span>
                                    <div>${step}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="stats-headline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    일일 창업 습관 트래커
                </div>

                <div class="dashboard-tracker-card">
                    <div class="tracker-stats-grid">
                        <div class="tracker-stat-box">
                            <div class="stat-num">${state.streak}일</div>
                            <div class="stat-lbl">연속 실천 일수</div>
                        </div>
                        <div class="tracker-stat-box">
                            <div class="stat-num">${state.completedCount}회</div>
                            <div class="stat-lbl">누적 완료 횟수</div>
                        </div>
                    </div>

                    <div class="weekly-calendar-title">최근 7일 실천 기록</div>
                    <div class="weekly-dots-container">
                        ${weeklyData.map(day => `
                            <div class="calendar-dot-box">
                                <div class="calendar-dot ${day.completed ? 'completed' : ''} ${day.isToday ? 'today' : ''}">
                                    ${day.completed ? `
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    ` : day.isToday ? '오늘' : ''}
                                </div>
                                <span class="calendar-day-label">${day.dayLabel}</span>
                            </div>
                        `).join('')}
                    </div>

                    <button class="complete-action-btn" id="btnCompleteToday" ${isTodayCompleted ? 'disabled' : ''}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        ${isTodayCompleted ? '오늘의 창업 활동 완료됨' : '오늘 하루, 한 걸음 걷기 완료'}
                    </button>
                </div>
            `;
        }

        function bindDashboardEvents() {
            const btnComplete = document.getElementById('btnCompleteToday');
            if (btnComplete) {
                btnComplete.addEventListener('click', () => {
                    const todayStr = new Date().toISOString().split('T')[0];
                    const alreadyCompleted = state.trackingHistory.some(log => log.date === todayStr && log.completed);
                    if (alreadyCompleted) return;

                    const updatedHistory = [...state.trackingHistory, { date: todayStr, completed: true }];
                    
                    state.trackingHistory = updatedHistory;
                    state.completedCount = state.completedCount + 1;
                    state.streak = state.streak + 1;
                });
            }
        }

        // --- (7) DEMO DATA INJECTION TOOL (Task 3 Advanced Feature Complete) ---
        document.getElementById('btnInjectDemo').addEventListener('click', () => {
            const history = [];
            const today = new Date();
            
            for (let i = 6; i >= 0; i--) {
                const pastDate = new Date();
                pastDate.setDate(today.getDate() - i);
                const dateStr = pastDate.toISOString().split('T')[0];
                history.push({
                    date: dateStr,
                    completed: true
                });
            }

            state.streak = 7;
            state.completedCount = 7;
            state.trackingHistory = history;
            
            // Set dynamic testing variables to make sure dashboard maps beautiful data immediately
            state.answers = {
                interest: "AI 비즈니스 자동화 (RPA, 업무 자동화 등)",
                time: "45분",
                platform: "온라인 디지털 자동화",
                skill: "파이썬 코딩 실력"
            };

            if (state.currentView !== 'dashboard') {
                navigateTo('dashboard');
            } else {
                render();
            }
        });

        document.getElementById('btnResetDemo').addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            state.currentView = 'survey';
            state.surveyStep = 1;
            state.answers = { interest: '', time: '', platform: '', skill: '' };
            state.streak = 0;
            state.completedCount = 0;
            state.trackingHistory = [];
            
            render();
        });

        // --- (8) APPLICATION INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromLocalStorage();
            
            // If the user already finished the survey previously, go straight to dashboard
            if (state.answers.interest && state.answers.time && state.answers.platform && state.answers.skill) {
                state.currentView = 'dashboard';
            } else {
                state.currentView = 'survey';
            }
            
            render();
        });
    </script>
</body>
</html>
